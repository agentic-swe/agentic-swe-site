# Build marketing site and deploy to GitHub Pages (project site: /<repo>/).
# Repo → Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Test route and viewport contracts
        run: npm test

      - name: Build site (subpath for project Pages)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Audit generated routes and metadata
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run audit

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
