# The site is published at https://agentic-swe.github.io/agentic-swe/ by the
# Pages workflow in agentic-swe/agentic-swe, which builds this repository.
# This repository's own Pages only redirects the old /agentic-swe-site/ URLs.
name: Deploy redirects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Test route and redirect contracts
        run: npm test

      - name: Emit redirect pages
        run: npm run build:redirect

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
