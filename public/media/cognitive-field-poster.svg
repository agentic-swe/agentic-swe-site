<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic SWE cognitive execution field</title>
  <desc id="desc">A sparse network of mint execution paths converging through an amber human gate into reusable memory.</desc>
  <defs>
    <radialGradient id="field" cx="72%" cy="46%" r="62%">
      <stop offset="0" stop-color="#162820"/>
      <stop offset=".42" stop-color="#0c1515"/>
      <stop offset="1" stop-color="#070a0d"/>
    </radialGradient>
    <radialGradient id="gateGlow">
      <stop offset="0" stop-color="#ffb15c" stop-opacity=".62"/>
      <stop offset=".28" stop-color="#ffb15c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffb15c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#eaf5f1" stroke-opacity=".025"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#field)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1130" cy="430" r="290" fill="none" stroke="#69dab8" stroke-opacity=".055"/>
  <circle cx="1130" cy="430" r="216" fill="none" stroke="#69dab8" stroke-opacity=".075"/>
  <circle cx="1130" cy="430" r="138" fill="none" stroke="#8c86ff" stroke-opacity=".08"/>
  <circle cx="1128" cy="430" r="164" fill="url(#gateGlow)" filter="url(#soft)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M658 212C790 214 820 325 927 346S1056 392 1128 430" stroke="#69dab8" stroke-opacity=".28"/>
    <path d="M600 432C755 430 805 432 932 430S1058 430 1128 430" stroke="#69dab8" stroke-opacity=".48" filter="url(#glow)"/>
    <path d="M680 666C806 648 848 554 946 523S1056 468 1128 430" stroke="#69dab8" stroke-opacity=".22"/>
    <path d="M1128 430C1208 430 1262 384 1334 314S1428 236 1510 244" stroke="#8c86ff" stroke-opacity=".18"/>
    <path d="M1128 430C1212 430 1285 430 1380 430S1484 430 1568 430" stroke="#69dab8" stroke-opacity=".34"/>
    <path d="M1128 430C1218 432 1284 492 1356 562S1450 656 1540 674" stroke="#8c86ff" stroke-opacity=".14"/>
  </g>
  <g fill="#69dab8">
    <circle cx="658" cy="212" r="4" fill-opacity=".8"/>
    <circle cx="600" cy="432" r="5"/>
    <circle cx="680" cy="666" r="4" fill-opacity=".7"/>
    <circle cx="927" cy="346" r="3" fill-opacity=".7"/>
    <circle cx="932" cy="430" r="4"/>
    <circle cx="946" cy="523" r="3" fill-opacity=".6"/>
    <circle cx="1380" cy="430" r="4" fill-opacity=".8"/>
  </g>
  <circle cx="1128" cy="430" r="8" fill="#ffb15c" filter="url(#glow)"/>
  <circle cx="1128" cy="430" r="22" fill="none" stroke="#ffb15c" stroke-opacity=".56"/>
  <circle cx="1128" cy="430" r="44" fill="none" stroke="#ffb15c" stroke-opacity=".12"/>
  <g fill="#eaf5f1" font-family="monospace" font-size="16" letter-spacing="2" opacity=".46">
    <text x="650" y="190">FRONTIER</text>
    <text x="1100" y="492">HUMAN GATE</text>
    <text x="1364" y="410">MEMORY</text>
  </g>
</svg>
